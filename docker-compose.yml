services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edusense-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: edusense
      POSTGRES_PASSWORD: edusense_dev_password
      POSTGRES_DB: edusense

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - edusense_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusense -d edusense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edusense_postgres_data: